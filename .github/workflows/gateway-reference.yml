name: Gateway reference checks
on:
  push:
    branches: [main, fix/reference-gateway-20261015, feat/living-lanterns]
    paths:
      - 'assets/v25/**'
      - 'assets/site.*'
      - 'index.html'
      - 'tests/gateway_reference.py'
      - 'tests/gateway_living.py'
      - 'tests/living-street.mjs'
      - 'tests/cat-motion.test.mjs'
      - 'tests/deployed-street.mjs'
      - 'tests/loading.mjs'
      - 'package*.json'
      - '.github/workflows/gateway-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies (not production dependencies)
        run: |
          npm ci --ignore-scripts
          python -m pip install playwright==1.55.0 pillow==11.3.0 numpy==2.3.3
          python -m playwright install --with-deps chromium
          npx playwright install --with-deps chromium
      - name: Syntax and real WebGL reference verification
        run: |
          node --check assets/v25/main.js
          npm test
          node tests/loading.mjs
          GATEWAY_PREVIEW_LOG=1 npm run test:browser
          python tests/gateway_reference.py --require-webgl
          python tests/gateway_living.py
      - name: Bake registered live-scene assets
        if: always()
        run: |
          node tests/bake-scene.mjs
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64
          root=Path('test-results/baked')
          for name,quality in [('base',91),('props',91),('poster',76)]:
              target=root/(name+'.webp')
              Image.open(root/(name+'.png')).save(target,quality=quality,method=6)
              print('BAKED_'+name.upper()+'_BASE64='+base64.b64encode(target.read_bytes()).decode())
          print('BAKED_MANIFEST_JSON='+root.joinpath('manifest.json').read_text())
          PY
      - name: Inspect the public Coolify deployment without blocking local regression results
        if: always()
        run: node tests/deployed-street.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-reference-proof
          path: test-results/
          retention-days: 7
