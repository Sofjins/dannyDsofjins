name: Inspect licensed cat asset
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect-cat.mjs'
      - '.github/workflows/inspect-cat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/inspect-cat.mjs
